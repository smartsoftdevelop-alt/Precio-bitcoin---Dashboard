name: Refresh exchange snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build compact CoinGecko snapshot
        run: node scripts/refresh-exchange-snapshot.mjs
      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- data/exchange-snapshot.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exchange-snapshot.json
          git commit -m "chore: refresh exchange snapshot"
          git push
