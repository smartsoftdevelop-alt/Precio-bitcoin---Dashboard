name: Fix dashboard branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-branding.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update static branding and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>Crypto Dashboard v3.1</title>','<title>ADOLFO | CRYPTO INTELLIGENCE</title>')
          s=s.replace('<div class="title">Crypto Dashboard v3.1</div>','<div class="title">ADOLFO | CRYPTO INTELLIGENCE</div>')
          s=s.replace('<div class="subtitle">Datos con fuente · estado · última actualización</div>','<div class="subtitle">Market Intelligence Terminal · Crypto · Macro · Derivatives · On-chain</div>')
          s=s.replace('<footer><span>Crypto Dashboard v3.1</span>','<footer><span>ADOLFO | CRYPTO INTELLIGENCE · v3.1</span>')
          s=s.replace('<script src="app-v31.js" defer></script>','<script src="app-v31.js?v=a94d95b" defer></script>')
          p.write_text(s)
          PY
      - name: Commit branding fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: make branding static and bust asset cache"
          git push
